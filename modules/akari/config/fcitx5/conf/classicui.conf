# Vertical Candidate List
VerticalCandidateList=False
# Use Per Screen DPI on X11
PerScreenDPI=True
# Font
Font="JetBrainsMono Nerd Font 12"
# Theme (directory name under ~/.local/share/fcitx5/themes)
Theme=akari-star
# Use dark theme
UseDarkTheme=True
# Menu Font
MenuFont="JetBrainsMono Nerd Font 11"
# Tray Font
TrayFont="JetBrainsMono Nerd Font 10"
# Tray outline color
TrayOutlineColor=#140e18
# Tray text color
TrayTextColor=#ff5c8a
# Prefer text icon
PreferTextIcon=False
# Show layout name in icon
ShowLayoutNameInIcon=False
# Use Accent Color
UseAccentColor=False
# Use Input method language to display text
UseInputMethodLanguageToDisplayText=True
# Force Wayland DPI
ForceWaylandDPI=96
