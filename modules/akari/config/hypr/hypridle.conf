# ============================================================================
# Akari Theme Idle Daemon (~/.config/hypr/hypridle.conf)
# Works on Hyprland; DPMS is routed through akari-dpms.
# ============================================================================

general {
    lock_cmd = $HOME/.local/bin/akari-ctl lock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = $HOME/.local/bin/akari-dpms on
}

listener {
    timeout = 600
    on-timeout = loginctl lock-session
}

listener {
    timeout = 900
    on-timeout = $HOME/.local/bin/akari-dpms off
    on-resume = $HOME/.local/bin/akari-dpms on
}

listener {
    timeout = 2400
    on-timeout = systemctl suspend
}
