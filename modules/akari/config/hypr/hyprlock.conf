# ============================================================================
# Fallback Hyprlock Config (~/.config/hypr/hyprlock.conf)
# Clean desktop wallpaper background + minimal M3 clock & password input
# ============================================================================

$font_main = JetBrains Mono

general {
    hide_cursor = false
    grace = 0
    ignore_empty_input = true
}

auth {
    pam {
        enabled = true
        module = hyprlock-gaze-simultaneous
    }
}

background {
    monitor =
    path = $HOME/.local/share/wallpapers/akari.jpg
    color = rgb(29, 15, 18)
    blur_passes = 0
}

label {
    monitor = DP-3
    text = $TIME
    color = rgb(248, 220, 222)
    font_size = 64
    font_family = $font_main
    position = 48, 72
    halign = left
    valign = bottom
}

input-field {
    monitor = DP-3
    size = 300, 44
    outline_thickness = 2
    dots_size = 0.24
    dots_spacing = 0.28
    dots_center = false

    outer_color = rgb(255, 178, 189)
    inner_color = rgb(38, 24, 26)
    font_color = rgb(248, 220, 222)
    check_color = rgb(89, 224, 119)
    fail_color = rgb(255, 180, 171)

    fade_on_empty = false
    rounding = 8
    font_family = $font_main
    placeholder_text = <span foreground="##e2bec1">パスワード</span>
    fail_text = $PAMFAIL

    position = -48, 40
    halign = right
    valign = bottom
}
