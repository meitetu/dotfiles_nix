# ============================================================================
# Akari Quickshell Raw Spectrum Config (60fps ASCII 0..1000 over PipeWire)
# ============================================================================

[general]
framerate = 60
autosens = 1
bars = 64

[input]
method = pipewire
source = auto

[output]
method = raw
raw_target = /dev/stdout
data_format = ascii
ascii_max_range = 1000
bar_delimiter = 59
frame_delimiter = 10
channels = stereo

[smoothing]
noise_reduction = 72
