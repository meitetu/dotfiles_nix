# ============================================================================
# Material 3 Kitty Terminal Theme (~/.config/kitty/kitty.conf)
# Matches Figma "Window/Kitty" (16:232) — Akari M3 Fidelity Palette
# ============================================================================

font_family      JetBrains Mono
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        12.0

window_padding_width 16 20
confirm_os_window_close 0
background_opacity 1.0
dynamic_background_opacity no
enable_audio_bell no

# M3 Primary Cursor
cursor #ffb2bd
cursor_text_color #670024
cursor_shape beam
cursor_trail 0

# M3 Tab Bar (TerminalTabs: surface-container-low #26181A, active: secondary-container #7F273B)
tab_bar_edge top
tab_bar_min_tabs 1
tab_bar_show_new_tab_button yes
tab_bar_style custom
tab_title_template " {custom} "
active_tab_foreground   #ffd6da
active_tab_background   #7f273b
active_tab_font_style   bold
inactive_tab_foreground #e2bec1
inactive_tab_background #26181a
inactive_tab_font_style normal
tab_bar_background      #26181a

scrollback_lines 10000
url_color #ffb2bd
url_style straight

selection_foreground #ffd6da
selection_background #7f273b

# Base Surface (surface-container-lowest #180A0C / on-surface #F8DCDE)
foreground #f8dcde
background #180a0c

# Black (surface-container / outline)
color0  #2b1b1e
color8  #a9898c

# Red / Coral (primary-container / primary)
color1  #ff4e7a
color9  #ffb2bd

# Green (tertiary emerald)
color2  #59e077
color10 #78fd90

# Yellow / Warm
color3  #eabf8f
color11 #ffddb9

# Blue / Soft Rose-Violet
color4  #ff869c
color12 #ffd9dd

# Magenta (secondary)
color5  #dc3261
color13 #ffb2bd

# Cyan
color6  #78fd90
color14 #b9f6ca

# White (on-surface-variant / on-surface)
color7  #e2bec1
color15 #f8dcde
